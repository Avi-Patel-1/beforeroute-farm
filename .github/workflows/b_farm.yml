name: B frozen-I/O farm (sky130)

# Workstream B (constraint hygiene, docs/qa_week/B_PREREG.md): LibreLane sky130 runs with the I/O budget frozen.
# Runs only on pushes to qa-b-frozen-io (or qa-b-asap7, the workstream's second lane) that change
# farm/qa/B/dispatch.json. Each push runs the batch named there:
#   run     - one matrix job per group (max-parallel from the batch); each group's runs or rebuild chains execute flow by
#             flow in the pinned LibreLane image via br/run_job.py (farm/qa/B/run_group.py); artifact b-<batch>-<group>
#   select2 - collects the chains left incomplete (job time budget, or stage 1 stopped at its first passing rebuild)
#   run2    - continues them with the same rule; artifact b-<batch>r-<group>
#   select3/run3 - once more for anything still incomplete; artifact b-<batch>rr-<group>

on:
  push:
    branches: [qa-b-frozen-io, qa-b-asap7]
    paths: ['farm/qa/B/dispatch.json']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/librelane/librelane@sha256:4bc9042ba177f73f275b5b39e7d372a07d3f4043f548a0ba7f640097b7205051
  PDK_VERSION: 8afc8346a57fe1ab7934ba5a6056ea8b43078e71

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.p.outputs.groups }}
      batch: ${{ steps.p.outputs.batch }}
      max_parallel: ${{ steps.p.outputs.max_parallel }}
      kind: ${{ steps.p.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open("farm/qa/B/dispatch.json"))
          groups = [g["name"] for g in d["groups"]]
          mp = int(d.get("max_parallel", 4))
          assert 1 <= mp <= 6, "workstream B share is 6 jobs"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("groups=" + json.dumps(groups) + "\n")
              f.write("batch=" + d["batch"] + "\n")
              f.write("max_parallel=" + str(mp) + "\n")
              f.write("kind=" + str(d.get("kind", "")) + "\n")
          print(d["batch"], mp, groups)
          PY

  run:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    name: ${{ needs.plan.outputs.batch }} ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore PDK cache
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: pdk
          key: sky130-${{ env.PDK_VERSION }}-v1
      - name: Pull toolchain image
        run: |
          for i in 1 2 3 4 5; do docker pull -q "$IMAGE" && break; echo "pull failed ($i)"; sleep $((60 * i)); done
          df -h / | tail -1
      - name: Fetch PDK (cache miss only)
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p pdk
          docker run --rm -v "$PWD:/work" -w /work -e PDK_ROOT=/work/pdk "$IMAGE" \
            ciel enable --pdk-family sky130 "$PDK_VERSION"
      - name: Install Optuna (arm C2b only; the version Addendum 35 ran)
        if: needs.plan.outputs.kind == 'c2b'
        run: |
          python3 -m pip install --user --quiet optuna==5.0.0 || python3 -m pip install --user --quiet --break-system-packages optuna==5.0.0
          python3 -c "import optuna; print('optuna', optuna.__version__)"
      - name: Run group
        run: |
          python3 farm/qa/B/run_group.py --spec farm/qa/B/dispatch.json --group "${{ matrix.group }}" \
            --image "$IMAGE" --results results --stage 1
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" results || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-${{ needs.plan.outputs.batch }}-${{ matrix.group }}
          path: results/
          retention-days: 30
          if-no-files-found: warn

  select2:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.outputs.groups != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.s.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: b-${{ needs.plan.outputs.batch }}-*
          path: arts
      - id: s
        run: |
          python3 farm/qa/B/resume.py --artifacts arts --batch "${{ needs.plan.outputs.batch }}r" --spec-out resume.json
          python3 -c "import json,os; d=json.load(open('resume.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('groups='+json.dumps([g['name'] for g in d['groups']])+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: b-${{ needs.plan.outputs.batch }}r-spec
          path: resume.json
          retention-days: 30

  run2:
    needs: [plan, select2]
    if: ${{ !cancelled() && needs.select2.outputs.groups != '' && needs.select2.outputs.groups != '[]' }}
    name: ${{ needs.plan.outputs.batch }}r ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        group: ${{ fromJSON(needs.select2.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: b-${{ needs.plan.outputs.batch }}r-spec
          path: spec
      - name: Restore PDK cache
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: pdk
          key: sky130-${{ env.PDK_VERSION }}-v1
      - name: Pull toolchain image
        run: |
          for i in 1 2 3 4 5; do docker pull -q "$IMAGE" && break; echo "pull failed ($i)"; sleep $((60 * i)); done
      - name: Fetch PDK (cache miss only)
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p pdk
          docker run --rm -v "$PWD:/work" -w /work -e PDK_ROOT=/work/pdk "$IMAGE" \
            ciel enable --pdk-family sky130 "$PDK_VERSION"
      - name: Continue chains
        run: |
          python3 farm/qa/B/run_group.py --spec spec/resume.json --group "${{ matrix.group }}" \
            --image "$IMAGE" --results results --stage 2
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" results || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-${{ needs.plan.outputs.batch }}r-${{ matrix.group }}
          path: results/
          retention-days: 30
          if-no-files-found: warn

  select3:
    needs: [plan, run2]
    if: ${{ !cancelled() && (needs.run2.result == 'success' || needs.run2.result == 'failure') }}
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.s.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: b-${{ needs.plan.outputs.batch }}*
          path: arts
      - id: s
        run: |
          python3 farm/qa/B/resume.py --artifacts arts --batch "${{ needs.plan.outputs.batch }}rr" --spec-out resume.json
          python3 -c "import json,os; d=json.load(open('resume.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('groups='+json.dumps([g['name'] for g in d['groups']])+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: b-${{ needs.plan.outputs.batch }}rr-spec
          path: resume.json
          retention-days: 30

  run3:
    needs: [plan, select3]
    if: ${{ !cancelled() && needs.select3.outputs.groups != '' && needs.select3.outputs.groups != '[]' }}
    name: ${{ needs.plan.outputs.batch }}rr ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        group: ${{ fromJSON(needs.select3.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: b-${{ needs.plan.outputs.batch }}rr-spec
          path: spec
      - name: Restore PDK cache
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: pdk
          key: sky130-${{ env.PDK_VERSION }}-v1
      - name: Pull toolchain image
        run: |
          for i in 1 2 3 4 5; do docker pull -q "$IMAGE" && break; echo "pull failed ($i)"; sleep $((60 * i)); done
      - name: Fetch PDK (cache miss only)
        if: steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p pdk
          docker run --rm -v "$PWD:/work" -w /work -e PDK_ROOT=/work/pdk "$IMAGE" \
            ciel enable --pdk-family sky130 "$PDK_VERSION"
      - name: Continue chains
        run: |
          python3 farm/qa/B/run_group.py --spec spec/resume.json --group "${{ matrix.group }}" \
            --image "$IMAGE" --results results --stage 3
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" results || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-${{ needs.plan.outputs.batch }}rr-${{ matrix.group }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
