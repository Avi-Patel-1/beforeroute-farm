name: BeforeRoute analysis

# Branch qa-e3-md5 (Addendum 40 / E3) version: no dataset build. Each matrix entry runs
#   python3 <script> <args> --out out/
# on the runner, with the farm's pinned LibreLane image pulled (the script runs yosys/sby/iverilog in it via docker),
# the farm's PDK cache restored when the args mention "gate", Verilator from apt when they mention "lockstep", and the
# OSS CAD Suite (latest release; tag and tarball sha256 logged) unpacked at /tmp/oss-cad-suite when they contain "--oss".
# Output: artifact analysis-<name>-<index> (out/).

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Python script in the repo'
        required: true
        type: string
      args_list:
        description: 'JSON array of argument strings; one matrix job per entry'
        required: false
        default: '[""]'
        type: string
      name:
        description: 'Artifact prefix (analysis-<name>-<index>)'
        required: true
        type: string
      max_parallel:
        description: 'Max concurrent analysis jobs'
        required: false
        default: '4'
        type: string
      dataset_run_id:
        description: 'Unused on this branch'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.name }} [${{ strategy.job-index }}] ${{ matrix.args }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        args: ${{ fromJSON(inputs.args_list) }}
    env:
      IMAGE: ghcr.io/librelane/librelane@sha256:4bc9042ba177f73f275b5b39e7d372a07d3f4043f548a0ba7f640097b7205051
      PDK_VERSION: 8afc8346a57fe1ab7934ba5a6056ea8b43078e71
      GH_TOKEN: ${{ github.token }}
      OSS_CAD: /tmp/oss-cad-suite
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          nproc; free -g; df -h / /mnt | cat; python3 --version

      - name: Restore PDK cache
        id: pdk-cache
        if: contains(matrix.args, 'gate')
        uses: actions/cache/restore@v4
        with:
          path: pdk
          key: sky130-${{ env.PDK_VERSION }}-v1

      - name: Pull toolchain image
        if: contains(matrix.args, 'formal') || contains(matrix.args, 'controls') || contains(matrix.args, 'gate')
        run: docker pull "$IMAGE"

      - name: Fetch PDK (cache miss only)
        if: contains(matrix.args, 'gate') && steps.pdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p pdk
          docker run --rm -v "$PWD:/work" -w /work -e PDK_ROOT=/work/pdk "$IMAGE" \
            ciel enable --pdk-family sky130 "$PDK_VERSION"

      - name: Verilator (apt)
        if: contains(matrix.args, 'lockstep')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator
          verilator --version

      - name: OSS CAD Suite (latest release)
        if: contains(matrix.args, '--oss')
        run: |
          tag=$(gh release view -R YosysHQ/oss-cad-suite-build --json tagName -q .tagName)
          echo "OSS_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p /tmp/ossdl
          gh release download "$tag" -R YosysHQ/oss-cad-suite-build --pattern 'oss-cad-suite-linux-x64-*.tgz' -D /tmp/ossdl
          sha256sum /tmp/ossdl/*.tgz
          tar -xzf /tmp/ossdl/*.tgz -C /tmp
          rm -rf /tmp/ossdl
          "$OSS_CAD/bin/yosys" -V; "$OSS_CAD/bin/yices-smt2" --version | head -1 || true

      - name: Run
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ matrix.args }}
        run: |
          mkdir -p out
          echo "+ python3 $SCRIPT $ARGS --out out"
          python3 "$SCRIPT" $ARGS --out out
          echo "exit $?"

      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out || true

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ inputs.name }}-${{ strategy.job-index }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
